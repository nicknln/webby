<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The gaff editor</title>
<link rel="stylesheet" href="static/style.css?v=dee7a69276">
</head>
<body>
<header class="topbar">
  <!-- Lined up with the post below: logo over its left edge, buttons over its right edge -->
  <div class="topbar-inner">
    <div class="brand-block">
      <div class="brand"><span class="logo">the gaff</span><span class="brand-sub">editor</span></div>
      <span class="save-status" id="save-status" aria-live="polite"></span>
    </div>
    <div class="top-actions">
      <label class="open-label editor-only">
        <span class="sr-only">Open a saved draft or edition</span>
        <select id="open-select"><option value="">Open a draft…</option></select>
      </label>
      <button class="btn editor-only" id="clear-btn">Clear page</button>
      <button class="btn editor-only" id="new-btn">New edition</button>
      <button class="btn primary editor-only" id="review-btn">Review &amp; build</button>
      <button class="btn primary contrib-only" id="send-part">Send my part</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Steps"></nav>

<main class="studio">
  <div class="canvas-scroll" id="scroll">
    <!-- The thread's title, shown above the post like on the community -->
    <div class="page-title">
      <h1 id="thread-title">The gaff</h1>
      <div class="view-switch editor-only" id="view-switch" role="group" aria-label="How to show the post"></div>
      <p class="due-line editor-only" id="due-line" hidden></p>
    </div>
    <div id="review"></div>
    <article class="post editing" id="canvas" aria-label="The gaff: type or paste into the boxes"></article>
  </div>
</main>

<dialog id="done-dialog" aria-labelledby="dialog-title">
  <form method="dialog" class="dialog-body" id="done-body"></form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<!-- Shown when the editor opens until dismissed: the walkthrough video if static/walkthrough.mp4 is there, otherwise a link to it -->
<aside class="intro" id="intro" aria-labelledby="intro-title" hidden>
  <div class="intro-head"><h2 id="intro-title">How the gaff editor works</h2><button class="intro-x" id="intro-close" type="button" aria-label="Dismiss the walkthrough">×</button></div>
  <video id="intro-video" muted loop playsinline controls preload="metadata" hidden></video>
  <p class="intro-text">Work down the page: paste each part in, tick it off, then copy the post onto the community.</p>
  <a class="intro-link" id="intro-link" href="https://claude.ai/artifact/JBkZDCDR58CsAb2eJTT69m" target="_blank" rel="noopener">Watch the 20-second walkthrough ↗<span class="sr-only"> (opens in a new tab)</span></a>
</aside>

<script src="static/md.js?v=512c4dd237"></script>
<script src="static/gaff.js?v=59878dafb9"></script>
<script src="static/store.js?v=ed5e7037ab"></script>
<script src="static/editor.js?v=4d7d2c563e"></script>
</body>
</html>
